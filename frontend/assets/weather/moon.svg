<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140">
  <defs>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4F0DC" stop-opacity="0.6"/>
      <stop offset="0.65" stop-color="#D9E2F0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#D9E2F0" stop-opacity="0"/>
    </radialGradient>
    <filter id="moonSoft" x="-50%" y="-50%" width="200%" height="200%">
