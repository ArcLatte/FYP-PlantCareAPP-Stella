    <path d="M70,38 C57,38 47,49 46,65 C45,83 58,97 75,99 C66,91 61,79 61,68 C61,56 66,45 76,39 C74,38 72,38 70,38 Z"
          fill="#FBF7E8" opacity="0.7"/>
  </g>
  <!-- soft craters -->
  <g fill="#DED7BE" opacity="0.5">
    <ellipse cx="58" cy="58" rx="5" ry="4"/>
    <ellipse cx="52" cy="80" rx="4" ry="3.4"/>
    <ellipse cx="66" cy="92" rx="3" ry="2.6"/>
