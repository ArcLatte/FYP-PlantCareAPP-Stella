<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dawnWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7B98C"/>
      <stop offset="0.5" stop-color="#F4C9B0"/>
      <stop offset="1" stop-color="#9FBBDD"/>
    </linearGradient>
    <filter id="dawnBleed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="dawnSpeckleSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="0.45"/>
    </filter>
  </defs>
  <rect width="360" height="260" fill="url(#dawnWash)"/>
  <!-- warm sunrise glow pooling low-right -->
  <g filter="url(#dawnBleed)">
    <ellipse cx="300" cy="180" rx="120" ry="80" fill="#FBD9A6" opacity="0.56"/>
    <ellipse cx="60" cy="60" rx="90" ry="40" fill="#F8C4A0" opacity="0.36"/>
    <path d="M-20,170 C70,150 150,182 230,168 C300,156 350,184 380,172 L380,260 L-20,260 Z" fill="#AEC6E2" opacity="0.48"/>
  </g>
  <g fill="#FFFFFF" opacity="0.06" filter="url(#dawnSpeckleSoft)">
    <circle cx="40" cy="36" r="1.3"/><circle cx="130" cy="24" r="1.1"/>
    <circle cx="220" cy="50" r="1.2"/><circle cx="95" cy="150" r="1.1"/>
    <circle cx="280" cy="120" r="1.2"/><circle cx="180" cy="200" r="1.1"/>
  </g>
</svg>
