<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140">
  <defs>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F8F4E5" stop-opacity="0.46"/>
      <stop offset="0.58" stop-color="#DDE7F3" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#DDE7F3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonSurface" x1="0.15" y1="0.15" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#FFFDF3"/>
      <stop offset="0.58" stop-color="#F3EEDB"/>
      <stop offset="1" stop-color="#DDD9C9"/>
    </linearGradient>
    <filter id="moonSoft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- One soft halo behind one clearly defined crescent. -->
  <circle cx="70" cy="70" r="60" fill="url(#moonGlow)"/>

  <!-- Single crescent silhouette; no nested duplicate moon. -->
  <path
    d="M82 27 C58 29 40 48 40 72 C40 96 59 113 83 113 C69 103 61 88 61 71 C61 53 69 38 82 27 Z"
    fill="#F4EFDC"
    opacity="0.30"
    filter="url(#moonSoft)"
  />
  <path
    d="M82 27 C58 29 40 48 40 72 C40 96 59 113 83 113 C69 103 61 88 61 71 C61 53 69 38 82 27 Z"
    fill="url(#moonSurface)"
    stroke="#FFFFFF"
    stroke-opacity="0.38"
    stroke-width="1.2"
  />

  <!-- Restrained surface detail kept inside the crescent body. -->
  <g fill="#C9C4B3" opacity="0.34">
    <ellipse cx="50" cy="59" rx="4.5" ry="3.5"/>
    <ellipse cx="48" cy="82" rx="3.5" ry="4.2"/>
    <ellipse cx="58" cy="99" rx="3" ry="2.4"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1">
    <ellipse cx="49" cy="58" rx="3.6" ry="2.7"/>
    <ellipse cx="47" cy="81" rx="2.7" ry="3.3"/>
  </g>
</svg>
